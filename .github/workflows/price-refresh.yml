# Automatic price refresh — the app updates itself instead of relying on
# the sidebar button. Hourly across Indian + European + US market hours on
# weekdays (times in UTC), plus manual runs via workflow_dispatch. Hourly,
# not more often: Yahoo quotes are ~15-min delayed anyway, and this keeps
# Actions usage at a fraction of the free private-repo quota (2,000
# min/month; each run bills rounded up to whole minutes).
#
# Requires the repository secret DATABASE_URL (Settings → Secrets and
# variables → Actions): the Supabase session-pooler URI.
name: Price refresh

on:
  schedule:
    - cron: "10 4-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # cached deps keep each run under a billed minute
      - name: Install dependencies
        run: uv sync --frozen
      - name: Refresh all users
        env:
          VERMO_BACKEND: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/refresh_all_users.py
