# Automatic price refresh — the app updates itself instead of relying on
# the sidebar button. Once per weekday at 22:10 UTC: after the US close
# (21:00 UTC in winter), so the day's snapshot captures the closing prices
# of all three markets (India ~10:00, Europe ~16:30, US ~20:00–21:00 UTC).
# The sidebar button remains for on-demand refreshes. Manual runs via
# workflow_dispatch.
#
# Requires the repository secret DATABASE_URL (Settings → Secrets and
# variables → Actions): the Supabase session-pooler URI.
name: Price refresh

on:
  schedule:
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # cached deps keep each run under a billed minute
      - name: Install dependencies
        run: uv sync --frozen
      - name: Refresh all users
        env:
          VERMO_BACKEND: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/refresh_all_users.py
