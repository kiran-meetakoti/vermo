[project]
name = "vermo"
version = "0.1.0"
description = "Global portfolio tracker for investments across India, Germany, and international markets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.12",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "psycopg[binary,pool]>=3.2",
    "pypdf>=6.14.2",
    "python-multipart==0.0.20",
    "sentry-sdk>=2.0",
    "streamlit==1.44.1",
    "uvicorn[standard]==0.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can import top-level modules
# (budget_db, auth) without an installed package.
pythonpath = ["."]
testpaths = ["tests"]
